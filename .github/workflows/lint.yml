name: HTML Linting

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  htmlhint:
    name: HTMLHint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run HTMLHint
        uses: htmlhint/action-htmlhint@v2
        with:
          files: 'index.html'
